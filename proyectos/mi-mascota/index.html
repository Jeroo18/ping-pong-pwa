<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7ef">
<meta name="description" content="Mi Mascota: vacunas, desparasitaciones, medicinas, visitas al veterinario y peso de tu perro o gato, con recordatorios en tu calendario.">
<title>Mi Mascota — Salud de tu perro y gato</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#fff7ef;--card:#fff;--line:#f0e2d3;--txt:#2b2118;--mut:#8a7766;--acc:#ff7a45;--ok:#2fa36b;--bad:#e5484d;--soon:#f5a524}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 14px 110px}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header h1{font-size:20px;margin:0;flex:1}
button.lang{font-size:16px;line-height:1;padding:5px 9px;border-radius:999px}
.pro{font-size:12px;font-weight:800;background:linear-gradient(90deg,#ffd36e,#ff8a5c);color:#2b2118;border-radius:999px;padding:5px 10px;border:0;cursor:pointer}
.back{border:0;background:none;font-size:22px;padding:4px 8px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 0 #f3e6d8}
.pets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pet{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;cursor:pointer;text-align:center}
.avatar{width:72px;height:72px;border-radius:50%;background:#ffe9da center/cover;display:flex;align-items:center;justify-content:center;font-size:38px;flex:none}
.pet b{font-size:16px}.pet small{color:var(--mut)}
.add{border:2px dashed var(--line);background:none;box-shadow:none;color:var(--mut);font-weight:700}
h3{margin:0 0 8px;font-size:15px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .ic{font-size:22px;width:32px;text-align:center}
.item .b{flex:1;min-width:0}
.item .b b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .b small{color:var(--mut);display:block}
.item .b .tag{display:inline-block;margin-top:4px}
.item .acts{display:flex;flex-direction:column;gap:6px}
.tag{font-size:11px;font-weight:800;border-radius:999px;padding:3px 8px;color:#fff;white-space:nowrap}
.tag.bad{background:var(--bad)}.tag.soon{background:var(--soon)}.tag.ok{background:var(--ok)}
button{font:inherit;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:12px;padding:9px 12px;cursor:pointer}
button.main{background:var(--acc);border-color:var(--acc);color:#fff}
button.sm{padding:6px 9px;font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap}
.tabs button.on{background:var(--txt);color:#fff;border-color:var(--txt)}
.hero{display:flex;align-items:center;gap:14px}
.hero .avatar{width:84px;height:84px}
.hero h2{margin:0}.hero small{color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:16px 0;font-size:14px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow:auto}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fffdfb;color:var(--txt)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.btns{display:flex;gap:8px;margin-top:16px}
.btns button{flex:1}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);width:58px;height:58px;border-radius:50%;font-size:28px;background:var(--acc);color:#fff;border:0;box-shadow:0 6px 18px #ff7a4566;z-index:5}
svg.chart{width:100%;height:160px}
.price{display:flex;gap:8px;margin:12px 0}
.price button{flex:1;display:flex;flex-direction:column;gap:2px}
.price small{font-weight:500;color:var(--mut)}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block;padding:20px;font-size:13px}#print table{width:100%;border-collapse:collapse}#print td,#print th{border:1px solid #ccc;padding:6px;text-align:left}}
</style>
</head>
<body>
<main id="view"></main>
<button class="fab" id="fab" hidden>+</button>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="print"></div>
<input type="file" id="fileIn" accept="application/json" hidden>
<script src="lang.js"></script>
<script src="strings.js"></script>
<script src="app.js"></script>
<script src="chat-strings.js"></script>
<script src="chat.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js')</script>
</body>
</html>
